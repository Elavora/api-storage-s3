name: Atualizar Packagist

on:
  workflow_run:
    workflows: [Release, Tag on merge]
    types: [completed]
  repository_dispatch:
    types: [tag-created]
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    uses: Elavora/.github/.github/workflows/sync-packagist.yml@a9c487de6c547dadb1e2785607eea4ae83541d70
    with:
      automation_ref: a9c487de6c547dadb1e2785607eea4ae83541d70
    secrets:
      PACKAGIST_WEBHOOK_URL: ${{ secrets.PACKAGIST_WEBHOOK_URL }}
